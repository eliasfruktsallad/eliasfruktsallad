<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Elias. Full-stack developer.">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="fade" cx="0.72" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1000" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .in { animation: in .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; } .cursor { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0f141b"/>
    <rect width="1000" height="300" fill="url(#dots)" mask="url(#dotmask)"/>
    <ellipse cx="760" cy="90" rx="320" ry="220" fill="url(#glowA)">
      <animate attributeName="cx" values="760;690;760" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="260" rx="300" ry="200" fill="url(#glowB)">
      <animate attributeName="cy" values="260;210;260" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="20" stroke="#262c36" stroke-width="1.5"/>

  <g class="in d1">
    <circle cx="64" cy="58" r="5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="63" class="mono" font-size="14" fill="#7d8590" letter-spacing=".4">github.com/eliasfruktsallad</text>
  </g>

  <text x="56" y="168" class="sans in d2" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#name)">Elias</text>

  <text x="60" y="210" class="sans in d3" font-size="22" font-weight="500" fill="#e6edf3">Full-stack developer<tspan fill="#7d8590" font-weight="400">  ·  clean interfaces, solid systems</tspan></text>

  <g class="in d4">
    <rect x="60" y="236" width="220" height="1.5" fill="url(#rule)"/>
    <text x="60" y="266" class="mono" font-size="14" fill="#7d8590"><tspan fill="#22d3ee">$</tspan> building things for the web<tspan class="cursor" fill="#e6edf3"> ▍</tspan></text>
  </g>
</svg>
