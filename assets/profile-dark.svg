<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" fill="none" role="img" aria-label="Elias. Developer, building for the web.">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
  <text x="0" y="52" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#e6edf3">Elias</text>
  <text x="0" y="92" font-size="19" fill="#7d8590">Developer, building for the web.</text>
  <text x="1000" y="52" text-anchor="end" font-size="15" fill="#7d8590">On GitHub since 2021</text>
  <rect x="0" y="140" width="1000" height="1" fill="#262c36"/>
  <text x="0" y="182" font-size="15" fill="#7d8590">About</text>
  <text x="230" y="182" font-size="17" fill="#e6edf3">I build interfaces and the systems behind them.</text>
  <text x="230" y="212" font-size="17" fill="#7d8590">Focused on clarity, performance and details that hold up.</text>
  <rect x="0" y="248" width="1000" height="1" fill="#262c36"/>
