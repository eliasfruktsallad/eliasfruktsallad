  <text x="370" y="290" font-size="17" fill="#e6edf3">TypeScript, JavaScript, Python, PHP</text>
  <text x="230" y="320" font-size="15" fill="#484f58">Frontend</text>
  <text x="370" y="320" font-size="17" fill="#e6edf3">React, Next.js, Vue, Tailwind, Sass</text>
  <text x="230" y="350" font-size="15" fill="#484f58">Backend</text>
  <text x="370" y="350" font-size="17" fill="#e6edf3">Node.js, PostgreSQL, MySQL, Docker, Linux</text>
  <rect x="0" y="386" width="1000" height="1" fill="#262c36"/>
