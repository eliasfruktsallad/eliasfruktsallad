<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" fill="none" role="img" aria-label="Now: building vk-studio. Focus: product-grade frontends and the APIs behind them. Principles: ship small, measure, refine.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .card { animation: in .8s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
  <g class="card" style="animation-delay:0.10s">
    <rect x="3" y="1" width="316" height="128" rx="18" fill="#0f141b" stroke="#262c36" stroke-width="1.5"/>
    <rect x="31" y="30" width="18" height="2" rx="1" fill="url(#acc)"/>
    <text x="31" y="58" class="sans" font-size="16" font-weight="650" fill="#e6edf3">Now</text>
    <text y="86" class="sans" font-size="14" fill="#7d8590"><tspan x="31" dy="0">Building vk-studio</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.22s">
    <rect x="342" y="1" width="316" height="128" rx="18" fill="#0f141b" stroke="#262c36" stroke-width="1.5"/>
    <rect x="370" y="30" width="18" height="2" rx="1" fill="url(#acc)"/>
    <text x="370" y="58" class="sans" font-size="16" font-weight="650" fill="#e6edf3">Focus</text>
    <text y="86" class="sans" font-size="14" fill="#7d8590"><tspan x="370" dy="0">Product-grade frontends</tspan><tspan x="370" dy="22">and the APIs behind them</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.34s">
    <rect x="681" y="1" width="316" height="128" rx="18" fill="#0f141b" stroke="#262c36" stroke-width="1.5"/>
    <rect x="709" y="30" width="18" height="2" rx="1" fill="url(#acc)"/>
    <text x="709" y="58" class="sans" font-size="16" font-weight="650" fill="#e6edf3">Principles</text>
    <text y="86" class="sans" font-size="14" fill="#7d8590"><tspan x="709" dy="0">Ship small, measure, refine.</tspan><tspan x="709" dy="22">Less, but better.</tspan></text>
  </g>
</svg>
